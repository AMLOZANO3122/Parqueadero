<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - RuedaSport</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="estil.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .back-container { margin-top: 30px; }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="content-box">
            <div class="info-content">
                <div class="logo-box">
                    <i class='bx bxs-car'></i> <span>RuedaSport</span>
                </div>
                <h1>¿Problemas?</h1>
                <p>“No te preocupes, dinos tu correo y te ayudaremos a recuperar el acceso en un segundo”.</p>
                
                <div class="back-container">
                    <a href="Cliente.html" class="btn-back">
                        <i class='bx bx-arrow-back'></i> Volver
                    </a>
                </div>
            </div>

            <div class="form-content">
                <h2>Recuperar Cuenta</h2>
                <form id="recoverForm">
                    <div class="input-box">
                        <input type="email" name="correo" id="recoverEmail" required>
                        <label>Ingresa tu correo registrado</label>
                        <i class='bx bxs-envelope icon-right'></i>
                    </div>
                    <button type="submit" class="btn btn-signin-glow">VERIFICAR CUENTA</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('recoverForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);

            fetch('ProcesarRecuperar.php', {
                method: 'POST',
                body: formData
            })
            .then(res => res.text())
            .then(data => {
                if (data.includes('success')) {
                    Swal.fire({
                        icon: 'success',
                        title: '¡Usuario verificado!',
                        text: 'Cuenta encontrada. Procede a cambiar tu contraseña.',
                        confirmButtonColor: '#ff0000'
                    }).then((result) => {
                        // REDIRECCIÓN CORREGIDA: Ahora va a la página de nueva clave
                        if (result.isConfirmed || result.isDismissed) {
                            window.location.href = 'NuevaPassword.html';
                        }
                    });
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'No encontrado',
                        text: 'Ese correo no está registrado en RuedaSport.',
                        confirmButtonColor: '#ff0000'
                    });
                }
            })
            .catch(error => console.error('Error:', error));
        });
    </script>
</body>
</html>
