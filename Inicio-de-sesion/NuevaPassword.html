<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nueva Contraseña - RuedaSport</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="estil.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="wrapper">
        <div class="content-box">
            <div class="info-content">
                <div class="logo-box"><i class='bx bxs-car'></i> <span>RuedaSport</span></div>
                <h1>Casi listo!</h1>
                <p>“Crea una nueva contraseña que sea segura y fácil de recordar para ti”.</p>
            </div>

            <div class="form-content">
                <h2>Nueva Contraseña</h2>
                <form id="newPassForm">
                    <div class="input-box">
                        <input type="password" name="nueva_pass" id="p1" required>
                        <label>Nueva contraseña</label>
                        <i class='bx bxs-show icon-right toggle-password' data-target="p1"></i>
                    </div>
                    <button type="submit" class="btn btn-signin-glow">ACTUALIZAR CLAVE</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('newPassForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);

            fetch('ActualizarPassword_db.php', {
                method: 'POST',
                body: formData
            })
            .then(res => res.text())
            .then(data => {
                if (data.includes('success')) {
                    Swal.fire({
                        icon: 'success',
                        title: '¡Clave actualizada!',
                        text: 'Ya puedes iniciar sesión con tu nueva contraseña.',
                        confirmButtonColor: '#ff0000'
                    }).then(() => { window.location.href = 'Cliente.html'; });
                } else {
                    Swal.fire({ icon: 'error', title: 'Error', text: 'No se pudo actualizar.' });
                }
            });
        });

        // Toggle para ver contraseña
        document.querySelector('.toggle-password').addEventListener('click', function() {
            const input = document.getElementById('p1');
            const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
            input.setAttribute('type', type);
            this.classList.toggle('bx-low-vision');
        });
    </script>
</body>
</html>
